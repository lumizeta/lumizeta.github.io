<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Emberwatch</title>
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #e9f2fa; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; outline: none; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             font: 16px "Segoe UI", system-ui, sans-serif; color: #2b3d55; background: #e9f2fa; z-index: 2; }
  #loading img { width: 128px; height: 128px; border-radius: 28px; box-shadow: 0 6px 24px rgba(30, 60, 100, .25); }
  #loading h1 { font-size: 28px; margin: 18px 0 6px; }
  #status { color: #5b6f88; padding: 0 16px; text-align: center; }
  #ver { position: absolute; bottom: 12px; color: #8a9bb0; font-size: 12px; }
</style>
</head>
<body>
<canvas id="the_canvas"></canvas>
<div id="loading">
  <img src="icon.png" alt="">
  <h1>Emberwatch</h1>
  <div id="status">Loading ...</div>
  <div id="ver">version 0.2.2 &middot; 2D battle view &middot; best on a desktop browser</div>
</div>
<script type="module">
  import init from "./ember_app.js?v=0e971c444d";
  init({ module_or_path: "./ember_app_bg.wasm?v=0e971c444d" }).catch((e) => {
    document.getElementById("status").textContent = "Could not start: " + e;
  });
</script>
</body>
</html>
